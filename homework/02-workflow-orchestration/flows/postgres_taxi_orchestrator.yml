id: postgres_taxi_orchestrator
namespace: zoomcamp
description: |
  Parent flow that orchestrates parallel ingestion of yellow and green taxi data
  from 2019 to 2021.
variables:
  years:
    - "2019"
    - "2020"
    - "2021"
  months:
    - "01"
    - "02"
    - "03"
    - "04"
    - "05"
    - "06"
    - "07"
    - "08"
    - "09"
    - "10"
    - "11"
    - "12"
tasks:
  - id: ingest_all_taxis
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: ingest_yellow_taxi
        type: io.kestra.plugin.core.flow.ForEach
        values: '{{vars.years}}'
        tasks:
          - id: ingest_yellow_year
            type: io.kestra.plugin.core.flow.ForEach
            values: '{{vars.months}}'
            tasks:
              - id: yellow_subflow
                type: io.kestra.plugin.core.flow.Subflow
                namespace: zoomcamp
                flowId: postgres_taxi_ingestion
                wait: true
                transmitFailed: false
                inputs:
                  taxi: yellow
                  year: '{{parent.taskrun.value}}'
                  month: '{{taskrun.value}}'
      - id: ingest_green_taxi
        type: io.kestra.plugin.core.flow.ForEach
        values: '{{vars.years}}'
        tasks:
          - id: ingest_green_year
            type: io.kestra.plugin.core.flow.ForEach
            values: '{{vars.months}}'
            tasks:
              - id: green_subflow
                type: io.kestra.plugin.core.flow.Subflow
                namespace: zoomcamp
                flowId: postgres_taxi_ingestion
                wait: true
                transmitFailed: false
                inputs:
                  taxi: green
                  year: '{{parent.taskrun.value}}'
                  month: '{{taskrun.value}}'
